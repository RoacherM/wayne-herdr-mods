<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Herdr</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f5f6; color: #1c1c1e; }
  main { max-width: 30em; padding: 2em 1.5em; text-align: center; line-height: 1.8; }
  button { margin-top: 1em; padding: .7em 1.6em; font-size: 1em; border: 0; border-radius: 999px;
           background: #1c1c1e; color: #fff; cursor: pointer; }
  #pair { display: none; margin-top: 1.5em; }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0b0c; color: #f2f2f7; }
    button { background: #f2f2f7; color: #1c1c1e; }
  }
</style>
</head>
<body>
<main>
  <p>网页版已停用。请在 iPhone 上的 Herdr App 里扫码配对。</p>
  <div id="pair">
    <p>这是一个配对链接。复制它，粘贴到 Herdr App 的配对输入框里。</p>
    <button id="copy" type="button">复制配对链接</button>
  </div>
</main>
<script>
  if (location.hash.startsWith('#p=')) document.getElementById('pair').style.display = 'block';
  document.getElementById('copy').addEventListener('click', async (e) => {
    try { await navigator.clipboard.writeText(location.href); e.target.textContent = '已复制'; } catch {}
  });
</script>
</body>
</html>
